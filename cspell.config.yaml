version: "0.2"
language: en
dictionaries:
  - css
  - html
  - typescript
enableFiletypes:
  - ignore
  - properties
  - xml
files:
  - "**/.*"
  - "**/*.{css,js,json,jsonc,html,md,scss,svelte,svg,yaml,yml,xml}"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
  # Claude Code session hooks, written in French (not part of the Worker).
  - .claude/**
  # Claude Code session instructions, written in French.
  - CLAUDE.md
words:
  - cooldown
  - CVEs
  - Decap
  - esbuild
  - GHSA
  - Ghsas
  - hostnames
  - jsdoc
  - kyoshino
  - PKCE
  - singleline
  - Sveltia
  - undici
  - unrs
  - workerd
